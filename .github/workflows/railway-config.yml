name: Railway config

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths: &paths
      - ".railway/**"
      - ".github/actions/railway-cli/**"
      - ".github/workflows/railway-config.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    paths: *paths

# Applies never overlap, and a newer merge supersedes a pending one; a newer PR push replaces its stale plan.
concurrency:
  group: railway-config-${{ github.event_name == 'push' && 'apply' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# An explicit shell adds pipefail, so a failed command isn't hidden behind tee.
defaults:
  run:
    shell: bash

# One job per environment, never a matrix: each token is read only by the step that runs the CLI,
# not by the installs before it, and is named literally so no other secret reaches the runner.
# Without --confirm-destructive, an apply that would delete something fails and is left to a human.
jobs:
  plan-production:
    name: Plan (production)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      COMMAND: plan
      ENVIRONMENT: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/railway-cli
      - run: &run |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          trap 'echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"' EXIT
          railway config "$COMMAND" --environment "$ENVIRONMENT" $FLAGS | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  plan-testing:
    name: Plan (testing)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      COMMAND: plan
      ENVIRONMENT: testing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/railway-cli
      - run: *run
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_TESTING }}

  apply-testing:
    name: Apply (testing)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      COMMAND: apply
      ENVIRONMENT: testing
      FLAGS: --yes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/railway-cli
      - run: *run
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_TESTING }}

  apply-production:
    name: Apply (production)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      COMMAND: apply
      ENVIRONMENT: production
      FLAGS: --yes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/railway-cli
      - run: *run
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
