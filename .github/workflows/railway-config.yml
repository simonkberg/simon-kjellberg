name: Railway config

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - ".railway/**"
      - ".github/actions/railway-cli/**"
      - ".github/workflows/railway-config.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  # Dependency bumps are planned but never applied, so they can't overwrite dashboard changes.
  push:
    branches: [main]
    paths:
      - ".railway/**"
      - ".github/actions/railway-cli/**"
      - ".github/workflows/railway-config.yml"

# Serialize applies; a newer PR push cancels its stale plan.
concurrency:
  group: railway-config-${{ github.event_name == 'push' && 'apply' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# An explicit shell adds pipefail, so a failed command isn't hidden behind tee.
defaults:
  run:
    shell: bash

# One job per environment, never a matrix or secrets[...]: either sends every secret to the runner.
# Railway rejects the testing project token, so testing logs in with a workspace token.
jobs:
  plan-production:
    name: Plan (production)
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      COMMAND: plan
      ENVIRONMENT: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/railway-cli
      - run: &run |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          trap 'echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"' EXIT
          railway config $COMMAND --environment "$ENVIRONMENT" | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  plan-testing:
    name: Plan (testing)
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      COMMAND: plan
      ENVIRONMENT: testing
      RAILWAY_PROJECT_ID: 8690fc81-5c07-4648-b2b8-5661eb0ffec1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/railway-cli
      - run: *run
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}

  apply-testing:
    name: Apply (testing)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      COMMAND: apply --yes
      ENVIRONMENT: testing
      RAILWAY_PROJECT_ID: 8690fc81-5c07-4648-b2b8-5661eb0ffec1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/railway-cli
      - run: *run
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}

  apply-production:
    name: Apply (production)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      COMMAND: apply --yes
      ENVIRONMENT: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/railway-cli
      - run: *run
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
