name: Railway config

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - ".railway/**"
      - ".github/workflows/railway-config.yml"

jobs:
  plan:
    name: Plan (production)
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: npm install -g @railway/cli@5.68.0
      # Exits 2 when production doesn't match the file: apply it by hand, as documented in AGENTS.md.
      - run: railway config plan --detailed-exit-code
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
