name: Railway config

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - ".railway/**"

permissions:
  contents: read
  pull-requests: write
  actions: read
  id-token: write

# Project tokens are scoped to one environment. testing is the base PR previews inherit from.
# Only production comments: without the Railway app, both would overwrite one PR comment.
jobs:
  plan:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: production
            comment: "true"
          - environment: testing
            comment: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: railwayapp/config@f1f0c715716fe035319b0a716b95c6e83e0f6595 # main, v1.2.0 runs npm install
        with:
          command: plan
          railway-token: ${{ matrix.environment == 'production' && secrets.RAILWAY_TOKEN || secrets.RAILWAY_TOKEN_TESTING }}
          artifact-name: railway-plan-${{ matrix.environment }}
          comment: ${{ matrix.comment }}

  apply:
    if: github.event.action == 'closed' && github.event.pull_request.merged && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: production
          - environment: testing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: railwayapp/config@f1f0c715716fe035319b0a716b95c6e83e0f6595 # main, v1.2.0 runs npm install
        with:
          command: apply
          railway-token: ${{ matrix.environment == 'production' && secrets.RAILWAY_TOKEN || secrets.RAILWAY_TOKEN_TESTING }}
          artifact-name: railway-plan-${{ matrix.environment }}
