name: Railway CLI
description: Install the dependencies .railway/railway.ts imports and the pinned Railway CLI.

runs:
  using: composite
  steps:
    - run: corepack enable
      shell: bash
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24.22.0
        cache: "pnpm"
    - run: pnpm install --frozen-lockfile --ignore-scripts
      shell: bash
    - run: npm install -g @railway/cli@5.68.0
      shell: bash
